version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    # build(deps) for a runtime bump, build(deps-dev) for a dev one: the
    # release-please gate releases on the former only.
    commit-message:
      prefix: build
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # @types/node major versions track the Node.js major. Keep this pinned
      # to the lowest supported runtime (Node 22 per package.json engines)
      # so types reflect what's actually available on every supported version.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        update-types:
          - minor
          - patch
