# Signal K server's reusable plugin CI: build, tests and formatting on every supported Node, and
# the plugin loaded in a running Signal K server.

name: SignalK Plugin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@master
    with:
      # engines.node is >=22.15; 26 is the current release
      node-versions: '["22", "24", "26"]'
      enable-armv7: false
      enable-signalk-integration: true
      format-check-command: npm run format:check

  # The plugin CI runs lint but lets it fail; here it blocks.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
